# HTTPS 证书申请前 bootstrap：仅 80 反代 + ACME 验证路径
#
# 用法:
#   sudo bash deploy/nginx/install-https.sh bootstrap
#   sudo certbot certonly --webroot -w /var/www/certbot -d api.lcxxingyu.fun
#   sudo bash deploy/nginx/install-https.sh ssl

upstream stday_api_bootstrap {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.lcxxingyu.fun;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://stday_api_bootstrap;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
